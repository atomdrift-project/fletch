[package]
name = "fletch"
version = "3.0.0"
edition = "2024"
# Build on any rustc within ~2 releases of current stable; edition 2024 implies
# the MSRV-aware resolver, so this also caps dependency versions.
rust-version = "1.97"
license = "Apache-2.0"
description = "Find and fetch external references (packages and URLs) discovered in analyzed files"
repository = "https://github.com/atomdrift-project/fletch"
# filefacts is consumed from git, so a crates.io package would
# be uninstallable until filefacts is published there.
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
unused_imports = "deny"
unused_mut = "deny"
dead_code = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
noop_method_call = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
result_unit_err = "deny"
result_large_err = "deny"
missing_safety_doc = "warn"
must_use_candidate = "warn"
needless_pass_by_value = "warn"
unnecessary_wraps = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
dbg_macro = "deny"
large_futures = "warn"
map_err_ignore = "warn"
wildcard_imports = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
type_complexity = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
single_match_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
# The reference vocabulary (Reference/RefLocator/PinnedHash) and the parsed
# facts `find` consumes. Use the same bare git URL as sibling consumers;
# Cargo.lock records the selected revision.
# Its default features (jemalloc, the CLI's signal and log plumbing) serve only
# the filefacts binary.
filefacts = { git = "https://github.com/atomdrift-project/filefacts.git", default-features = false }

# HTTPS client. rustls-tls avoids a system OpenSSL dependency; blocking keeps
# the fetcher off any async runtime.
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Hardware SHA acceleration is automatic; no assembly feature is needed (and
# sha2-asm's GAS sources would not build under MSVC).
sha2 = "0.11"
# Legacy npm `integrity` pins (`sha1-…`) — every entry in a yarn v1 lockfile.
sha1 = "0.11"
base64 = "0.22"
hex = "0.4"
zstd = "0.14"
# gzip for OS-distro package indices (Alpine APKINDEX, Debian Packages,
# openSUSE primary.xml, BSD catalogs); zstd (above) and xz2 (below) cover the
# other index codecs. flate2 defaults to the pure-Rust miniz_oxide backend.
flate2 = "1"
roxmltree = "0.21"
thiserror = "2"
tracing = "0.1"
# The CLI's stderr log; the library only emits events.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
anyhow = "1"
dirs = "6"
# `rt` backs `spawn_blocking` in the SSRF resolver: getaddrinfo blocks, so
# it runs off reqwest's runtime thread.
tokio = { version = "1.54.1", features = ["rt"] }
tar = "0.4.46"
xz2 = "0.1.7"
pep440_rs = "0.7.3"
node-semver = "2.2.0"
semver = "1"
# Go module zips: read-only, deflate via the flate2 already in the graph.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[features]
# The offline `fetch::Fixtures` backend, for tests in this crate and its
# dependents.
test-util = []

[dev-dependencies]
tempfile = "3"
# Enables `test-util` for this crate's own integration tests.
fletch = { path = ".", features = ["test-util"] }

# tree-sitter, pulled in through filefacts, comes from a fork that carries
# illumos support for the vendored endian.h (cross-rs's illumos toolchain does
# not predefine __illumos__). filefacts requires tree-sitter ^0.28, which is not
# on crates.io, so this block is also what makes the graph resolve. Both
# tree-sitter crates must come from one source (`links = "tree-sitter-language"`
# allows a single copy). Keep these bare fork URLs in sync across sibling
# roots; Cargo.lock records revisions. Drop once an upstream release carries the fix.
[patch.crates-io]
# Inherited from a sibling by update-deps: [patch] applies only in the root.
tree-sitter-bash = { git = "https://github.com/tstromberg/tree-sitter-bash" }
tree-sitter = { git = "https://github.com/tstromberg/tree-sitter" }
tree-sitter-language = { git = "https://github.com/tstromberg/tree-sitter" }
