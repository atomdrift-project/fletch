name: CI

on:
  push:
  pull_request:

# Third-party actions are pinned by commit, not by a movable tag.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The minimum supported Rust version; keep in sync with Cargo.toml.
  MSRV: "1.97"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # A pinned purl-spec revision keeps the conformance run deterministic;
      # move it deliberately alongside the vendored copy in tests/data.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: package-url/purl-spec
          ref: 7cd2d3442fb9c88155db17ada7c911b40ec22d41
          path: purl-spec
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.MSRV }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
        env:
          PURL_SPEC_DIR: ${{ github.workspace }}/purl-spec
      - run: cargo test --locked --doc
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - run: cargo build --locked --release --features cli

  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
      - run: cargo test --locked --lib --bins --all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071 (rsa, Marvin timing attack) concerns private-key
      # decryption; the graph only verifies RSA signatures with public keys.
      - run: cargo audit --ignore RUSTSEC-2023-0071
