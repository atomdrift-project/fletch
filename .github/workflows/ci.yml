name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: package-url/purl-spec
          path: purl-spec
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
        env:
          PURL_SPEC_DIR: ${{ github.workspace }}/purl-spec
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - run: cargo build --release --locked

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --bins

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # filefacts only performs RSA public-key verification; it never executes
      # the vulnerable private-key operation covered by RUSTSEC-2023-0071.
      - run: cargo audit --ignore RUSTSEC-2023-0071
