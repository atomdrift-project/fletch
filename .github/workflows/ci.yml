name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The minimum supported Rust version; keep in sync with Cargo.toml.
  MSRV: "1.97"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A pinned purl-spec revision keeps the conformance run deterministic;
      # move it deliberately alongside the vendored copy in tests/data.
      - uses: actions/checkout@v4
        with:
          repository: package-url/purl-spec
          ref: 7cd2d3442fb9c88155db17ada7c911b40ec22d41
          path: purl-spec
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
        env:
          PURL_SPEC_DIR: ${{ github.workspace }}/purl-spec
      - run: cargo test --locked --doc
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - run: cargo build --locked --release

  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib --bins

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071 (rsa, Marvin timing attack) concerns private-key
      # decryption; the graph only verifies RSA signatures with public keys.
      - run: cargo audit --ignore RUSTSEC-2023-0071
